<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdeAI - İdeal Yapay Zeka</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🧠 İdeAI</h2>
            <span class="status-dot"></span> Online
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Merhaba! Ben İdeAI. Bugün senin için neyi ideal hale getirebilirim?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Bir şeyler yazın..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
